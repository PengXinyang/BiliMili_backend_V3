<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>BiliMili 实机验收记录</title><style>body{background:#f3f6fa;color:#152d47;font:15px/1.7 'Microsoft YaHei',sans-serif;padding:32px;margin:0}main{max-width:1280px;margin:auto}header{background:#142c48;color:white;padding:22px 28px;border-radius:12px;margin-bottom:22px}h1{font-size:26px;margin:0}header p{color:#b4c9db;margin:8px 0 0}article{background:white;border:1px solid #dce5ef;border-radius:12px;padding:24px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:13px;border-bottom:1px solid #e7edf3}th{color:#64768c}td:first-child{white-space:nowrap}td:nth-child(2){color:#087755;white-space:nowrap}pre{font:13px/1.7 Consolas,'Microsoft YaHei',monospace;white-space:pre-wrap;margin:0;word-break:break-word}.note{color:#64768c;font-size:13px;padding-top:15px}#count{float:right;color:#89e3cf}</style><main><header><h1>BiliMili 实机验收记录 <span id="count"></span></h1><p id="time"></p></header><article><table><thead><tr><th>验收项目</th><th>结果</th><th>实测结果 / 关键证据</th></tr></thead><tbody></tbody></table><div class="note">来源：verify_local.py 对实际 Kubernetes 服务执行的请求和断言。此页面展示已保存的验收记录；重建验证仅重启 message-service，未清空数据库。</div></article></main><script>fetch('verification.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.querySelector('#time').textContent='采集时间：'+d.collectedAt+'　|　docker-desktop / bilimili';document.querySelector('#count').textContent=d.checks.filter(x=>x.passed).length+' 项通过';for(const c of d.checks){const tr=document.createElement('tr');for(const [i,v]of [c.name,c.passed?'通过':'未通过',Object.entries(c.detail.category?{title:c.detail.title,author:c.detail.author,category:c.detail.category.mainClassName+' / '+c.detail.category.subClassName}:c.detail).map(([k,v])=>k+': '+JSON.stringify(v)).join('\n')].entries()){const td=document.createElement('td');if(i===2){const pre=document.createElement('pre');pre.textContent=v;td.append(pre)}else td.textContent=v;tr.append(td)}document.querySelector('tbody').append(tr)}})</script></html>
