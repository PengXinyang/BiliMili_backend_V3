server.port: 8081
spring.main.allow-circular-references: true
spring.datasource.url: jdbc:mysql://mysql:3306/USERSERVICE?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username: user_app
spring.datasource.password: ${DB_PASSWORD}
spring.datasource.account: local-admin
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.initial-size: 1
spring.datasource.min-idle: 1
spring.datasource.max-active: 10
spring.redis.host: redis
spring.redis.port: 6379
spring.redis.timeout: 3000
spring.redis.jedis.pool.max-idle: 8
spring.redis.jedis.pool.max-wait: 3000
elasticsearch.host: elasticsearch
elasticsearch.port: 9200
elasticsearch.username: ''
elasticsearch.password: ''
oss.bucket: bilimili-local
oss.bucketUrl: /media/
storage.local-root: /data/media
directory.chunk: /data/chunks/
spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
mybatis-plus.configuration.map-underscore-to-camel-case: true
feign.client.config.default.connectTimeout: 3000
feign.client.config.default.readTimeout: 10000
spring.cloud.sentinel.enabled: false
spring.jackson.time-zone: Asia/Shanghai
