apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: bilimili
spec:
  selector:
    app: gateway-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: bilimili
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: bilimili/gateway-service:frontend-20261127
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 768Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: k8s
        - name: JAVA_TOOL_OPTIONS
          value: -Xms96m -Xmx384m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
        - name: NACOS_SERVER_ADDR
          value: nacos:8848
        - name: MESSAGE_ALLOWED_ORIGINS
          value: http://localhost:18080,http://127.0.0.1:18080,http://localhost:8787,http://127.0.0.1:8787,http://localhost:8788,http://127.0.0.1:8788
        - name: GATEWAY_ALLOWED_ORIGINS
          value: http://localhost:18080,http://127.0.0.1:18080,http://localhost:8787,http://127.0.0.1:8787,http://localhost:8788,http://127.0.0.1:8788
        - name: NACOS_NAMESPACE
          value: ''
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        startupProbe:
          httpGet: &id001
            path: /actuator/health/liveness
            port: 8080
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: bilimili
spec:
  selector:
    app: user-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: bilimili
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: bilimili/user-service:lab-20261127
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 768Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: k8s,local-storage
        - name: JAVA_TOOL_OPTIONS
          value: -Xms96m -Xmx384m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
        - name: NACOS_SERVER_ADDR
          value: nacos:8848
        - name: MESSAGE_ALLOWED_ORIGINS
          value: http://localhost:18080,http://127.0.0.1:18080,http://localhost:8787,http://127.0.0.1:8787,http://localhost:8788,http://127.0.0.1:8788
        - name: GATEWAY_ALLOWED_ORIGINS
          value: http://localhost:18080,http://127.0.0.1:18080,http://localhost:8787,http://127.0.0.1:8787,http://localhost:8788,http://127.0.0.1:8788
        - name: NACOS_NAMESPACE
          value: ''
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bilimili-secrets
              key: db-password
        - name: MESSAGE_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: bilimili-secrets
              key: message-token
        volumeMounts:
        - name: media
          mountPath: /data/media
        - name: chunks
          mountPath: /data/chunks
        startupProbe:
          tcpSocket: &id001
            port: 8081
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          tcpSocket: *id001
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 3
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: media-data
      - name: chunks
        emptyDir: {}
---
