  NACOS_GROUP: DEFAULT_GROUP
  GATEWAY_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8091
  MESSAGE_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8091
