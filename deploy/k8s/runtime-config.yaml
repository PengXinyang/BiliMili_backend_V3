# 此文件只提供运行参数；后续完整部署仍需 Deployment、Service、数据库与 Nacos。
apiVersion: v1
kind: ConfigMap
metadata:
  name: bilimili-runtime
data:
  SPRING_PROFILES_ACTIVE: k8s
  NACOS_SERVER_ADDR: nacos:8848
