spring.application.name=message-service
server.port=${MESSAGE_PORT:8084}
spring.datasource.url=${MESSAGE_DB_URL:jdbc:mysql://localhost:3306/MESSAGESERVICE?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${MESSAGE_DB_USER:message}
spring.datasource.password=${MESSAGE_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
message.user-service-url=${USER_SERVICE_URL:http://localhost:8081}
message.internal-token=${MESSAGE_INTERNAL_TOKEN:}
message.allowed-origins=${MESSAGE_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.error.include-message=never
