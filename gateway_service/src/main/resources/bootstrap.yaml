spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${POD_IP:}
    gateway:
      discovery:
        locator:
          enabled: false # 仅暴露明确声明的路由，避免自动暴露整个服务。
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST
      routes:
        - id: local-media
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/media/**
        - id: message-websocket
          uri: ${bilimili.message-ws-url}
          predicates:
            - Path=/message/im
          filters:
            - StripPrefix=1
        - id: message-websocket-legacy
          uri: ${bilimili.message-ws-url}
          predicates:
            - Path=/im
        - id: message-service
          uri: ${bilimili.message-url}
          predicates:
            - Path=/message/**
          filters:
            - StripPrefix=1
        - id: message-unread-legacy
          uri: ${bilimili.message-url}
          predicates:
            - Path=/user/msg-unread/**
          filters:
            - StripPrefix=1
        - id: user-video-interactions
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/user/video/collected-fids,/user/video/play/user
          filters:
            - StripPrefix=1
        - id: user-public-paths
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/user/account/**,/user/personal/**,/user/password/**,/user/info/**,/user/avatar/**,/user/favorite/**,/user/following/**,/user/fans/**,/user/follow/**,/user/followed/**,/user/user_record,/user/video/**
        - id: article-public-paths
          uri: ${ARTICLE_SERVICE_URL:lb://article-service}
          predicates:
            - Path=/article/get,/article/change/**,/article/user-works,/article/add/**
        - id: video-public-paths
          uri: ${VIDEO_SERVICE_URL:lb://video-service}
          predicates:
            - Path=/video/change/**,/video/user-works-count,/video/user-love,/video/user-play
        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: video-service
          uri: ${VIDEO_SERVICE_URL:lb://video-service}
          predicates:
            - Path=/video/**
          filters:
            - StripPrefix=1
        - id: article-service
          uri: ${ARTICLE_SERVICE_URL:lb://article-service}
          predicates:
            - Path=/article/**
          filters:
            - StripPrefix=1
server:
  port: ${SERVER_PORT:8080}
gateway:
  allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8091}
bilimili:
  message-url: ${MESSAGE_SERVICE_URL:http://localhost:8084}
  message-ws-url: ${MESSAGE_SERVICE_WS_URL:ws://localhost:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.cloud.gateway: INFO
